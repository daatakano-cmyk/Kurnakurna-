<html lang="en">
<head>

<style>
*{box-sizing:border-box}
body{
 margin:0;

button,input{font:inherit}

.auth{

.logo{

input{

.btn{

.full{width:100%;margin-top:8px}

.main{margin-left:235px}

.bottom{display:none}

a{

<script type="module">

/* =====================================================
   FIREBASE CONFIGURATION
   KURNAKURNA 45d9b
===================================================== */

import {
 initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged,
 updateProfile,
 sendEmailVerification
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getDatabase,
 ref,
 set,
 get,
 push,
 onValue,
 query,
 orderByChild,
 limitToLast
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

 apiKey:
 "AIzaSyAOnxx7a-7iElWu0GUfTlPuH5UNtgcXv8c",

 authDomain:
 "kurnakurna-45d9b.firebaseapp.com",

 databaseURL:
 "https://kurnakurna-45d9b-default-rtdb.firebaseio.com",

 projectId:
 "kurnakurna-45d9b",

 storageBucket:
 "kurnakurna-45d9b.firebasestorage.app",

 messagingSenderId:
 "308258679773",

 appId:
 "1:308258679773:web:0ebb35ea36c2cd8db32434"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const firebaseApp =
 initializeApp(firebaseConfig);

const auth =
 getAuth(firebaseApp);

const db =
 getDatabase(firebaseApp);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let user = null;

let stopMessages = null;

let currentUser = null;

let page = "chats";


/* =====================================================
   NAVIGATION
===================================================== */

const nav = [

 ["chats","💬 Chats"],

 ["status","⭕ Status"],

 ["groups","👥 Groups"],

 ["market","🛒 Market"],

 ["wallet","💰 Wallet"],

 ["games","🎮 Games"],

 ["profile","👤 Profile"],

 ["settings","⚙️ Settings"]

];


function renderNavigation(){

 let html = nav.map(item => {

  return `
   <div
    class="nav ${page===item[0]?"active":""}"
    onclick="go('${item[0]}')"
   >
    ${item[1]}
   </div>
  `;

 }).join("");

 side.innerHTML = html;

 bottom.innerHTML = html;

}


function go(p){

 page = p;

 renderNavigation();

 const found =
  nav.find(x => x[0] === p);

 title.textContent =
  found ? found[1].replace(/^\\S+ /,"") : "KURNAKURNA";


 if(stopMessages){

  stopMessages();

  stopMessages = null;

 }


 if(p==="chats") chats();

 if(p==="status") status();

 if(p==="groups") groups();

 if(p==="market") market();

 if(p==="wallet") wallet();

 if(p==="games") games();

 if(p==="profile") profile();

 if(p==="settings") settings();

}


window.go = go;


/* =====================================================
   LOGIN / SIGNUP
===================================================== */

function toggle(){

 login.classList.toggle("hidden");

 signup.classList.toggle("hidden");

}

window.toggle = toggle;


async function signup(){

 try{

  const name =
   sn.value.trim();

  const email =
   se.value.trim();

  const password =
   sp.value;

  if(!name){

   alert("Enter your name.");

   return;

  }

  if(password.length < 6){

   alert("Password must contain at least 6 characters.");

   return;

  }


  const credential =
   await createUserWithEmailAndPassword(
    auth,
    email,
    password
   );


  await updateProfile(
   credential.user,
   {
    displayName:name
   }
  );


  await set(
   ref(
    db,
    "users/"+credential.user.uid
   ),
   {
    uid:credential.user.uid,

    name:name,

    email:email,

    createdAt:Date.now()
   }
  );


  await sendEmailVerification(
   credential.user
  ).catch(()=>{});


  alert(
   "Account created successfully."
  );


 }catch(error){

  alert(error.message);

 }

}

window.signup = signup;


async function login(){

 try{

  const email =
   le.value.trim();

  const password =
   lp.value;

  await signInWithEmailAndPassword(
   auth,
   email,
   password
  );

 }catch(error){

  alert(error.message);

 }

}

window.login = login;


async function logout(){

 await signOut(auth);

}

window.logout = logout;


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
 auth,
 async current => {

  user = current;


  if(user){

   authDiv();

   const userRef =
    ref(
     db,
     "users/"+user.uid
    );

   const snapshot =
    await get(userRef);


   if(!snapshot.exists()){

    await set(
     userRef,
     {
      uid:user.uid,

      name:
       user.displayName ||
       "KURNAKURNA User",

      email:
       user.email || "",

      createdAt:
       Date.now()
     }
    );

   }


   renderNavigation();

   go("chats");


  }else{

   document
    .getElementById("auth")
    .classList.remove("hidden");

   document
    .getElementById("app")
    .classList.add("hidden");

  }

 }
);


function authDiv(){

 document
  .getElementById("auth")
  .classList.add("hidden");

 document
  .getElementById("app")
  .classList.remove("hidden");

}


/* =====================================================
   GET USERS
===================================================== */

async function getUsers(){

 const snapshot =
  await get(
   ref(db,"users")
  );


 if(!snapshot.exists())
  return [];


 return Object
  .values(snapshot.val())
  .filter(
   x => x.uid !== user.uid
  );

}


/* =====================================================
   CHATS
===================================================== */

async function chats(){

 content.innerHTML = `

  <h2>Chats</h2>

  <input
   id="search"
   placeholder="Search KURNAKURNA users..."
   oninput="filterUsers()"
  >

  <div
   id="list"
   class="chatlist"
  >
   Loading users...
  </div>

 `;


 window.allUsers =
  await getUsers();


 drawUsers(
  window.allUsers
 );

}


function drawUsers(users){

 if(!list)
  return;


 if(!users.length){

  list.innerHTML = `

   <div class="card muted">
    No other users yet.
   </div>

  `;

  return;

 }


 list.innerHTML =
  users.map(u => `

   <div
    class="chat"
    onclick="openChat('${u.uid}')"
   >

    <div
     class="avatar"
     style="
      display:grid;
      place-items:center;
     "
    >
     👤
    </div>

    <div>

     <b>
      ${escapeHTML(u.name)}
     </b>

     <div class="muted">
      ${escapeHTML(u.email)}
     </div>

    </div>

   </div>

  `).join("");

}


window.filterUsers = function(){

 const q =
  search.value.toLowerCase();


 drawUsers(

  (window.allUsers || [])
   .filter(u =>

    (u.name || "")
     .toLowerCase()
     .includes(q)

    ||

    (u.email || "")
     .toLowerCase()
     .includes(q)

   )

 );

};


/* =====================================================
   CHAT
===================================================== */

function chatID(a,b){

 return [
  a,
  b
 ]
 .sort()
 .join("_");

}


window.openChat =
 async function(uid){

  const snapshot =
   await get(
    ref(
     db,
     "users/"+uid
    )
   );


  if(!snapshot.exists())
   return;


  currentUser =
   snapshot.val();


  content.innerHTML = `

   <div class="card">

    <button
     class="btn secondary"
     onclick="go('chats')"
    >
     ← Back
    </button>

    <b style="margin-left:10px">
     ${escapeHTML(currentUser.name)}
    </b>

   </div>


   <div
    id="messages"
    class="messages"
   ></div>


   <div class="composer">

    <input
     id="messageInput"
     placeholder="Type a message..."
     onkeydown="
      if(event.key==='Enter')
      sendMessage()
     "
    >

    <button
     class="btn"
     onclick="sendMessage()"
    >
     ➤
    </button>

   </div>

  `;


  const id =
   chatID(
    user.uid,
    currentUser.uid
   );


  const messagesRef =
   query(
    ref(db,"chats/"+id),
    orderByChild("createdAt"),
    limitToLast(200)
   );


  stopMessages =
   onValue(
    messagesRef,
    snapshot => {

     messages.innerHTML = "";


     snapshot.forEach(
      child => {

       const message =
        child.val();


       const bubble =
        document.createElement("div");


       bubble.className =
        "bubble " +
        (
         message.from === user.uid
         ? "me"
         : ""
        );


       bubble.textContent =
        message.text;


       messages.appendChild(
        bubble
       );

      }
     );


     messages.scrollTop =
      messages.scrollHeight;

    }
   );

 };


window.sendMessage =
 async function(){

  const input =
   document.getElementById(
    "messageInput"
   );


  const text =
   input.value.trim();


  if(!text ||
     !currentUser)
   return;


  const id =
   chatID(
    user.uid,
    currentUser.uid
   );


  await push(
   ref(
    db,
    "chats/"+id
   ),
   {

    text:text,

    from:user.uid,

    to:currentUser.uid,

    createdAt:Date.now()

   }
  );


  input.value = "";

 };


/* =====================================================
   STATUS
===================================================== */

function status(){

 content.innerHTML = `

  <h2>Status</h2>

  <div class="card">

   <button
    class="btn"
    onclick="addStatus()"
   >
    ＋ Add Status
   </button>

  </div>

  <div
   id="statusList"
   class="card"
  >
   Loading...
  </div>

 `;


 loadStatus();

}


window.addStatus =
 async function(){

  const text =
   prompt(
    "Write your status:"
   );


  if(!text)
   return;


  await push(
   ref(db,"statuses"),
   {

    uid:user.uid,

    name:
     user.displayName ||
     "User",

    text:text,

    createdAt:
     Date.now()

   }
  );


  loadStatus();

 };


async function loadStatus(){

 const snapshot =
  await get(
   ref(db,"statuses")
  );


 if(!snapshot.exists()){

  statusList.innerHTML =
   "No statuses yet.";

  return;

 }


 const statuses =
  Object
   .values(snapshot.val())
   .sort(
    (a,b)=>
     b.createdAt-a.createdAt
   );


 statusList.innerHTML =
  statuses.map(s => `

   <div class="card">

    <b>
     ${escapeHTML(s.name)}
    </b>

    <p>
     ${escapeHTML(s.text)}
    </p>

    <small class="muted">
     ${new Date(
      s.createdAt
     ).toLocaleString()}
    </small>

   </div>

  `).join("");

}


/* =====================================================
   GROUPS
===================================================== */

function groups(){

 content.innerHTML = `

  <h2>Groups</h2>

  <div class="card">

   <button
    class="btn"
    onclick="createGroup()"
   >
    ＋ Create Group
   </button>

  </div>

  <div id="groupsList"></div>

 `;


 loadGroups();

}


window.createGroup =
 async function(){

  const name =
   prompt(
    "Group name:"
   );


  if(!name)
   return;


  const groupRef =
   push(
    ref(db,"groups")
   );


  await set(
   groupRef,
   {

    name:name,

    createdBy:
     user.uid,

    createdAt:
     Date.now(),

    members:{
     [user.uid]:true
    }

   }
  );


  loadGroups();

 };


async function loadGroups(){

 const snapshot =
  await get(
   ref(db,"groups")
  );


 if(!snapshot.exists()){

  groupsList.innerHTML = `

   <div class="card muted">
    No groups yet.
   </div>

  `;

  return;

 }


 groupsList.innerHTML =
  Object
   .values(snapshot.val())
   .map(g => `

    <div class="card">

     <h3>
      👥 ${escapeHTML(g.name)}
     </h3>

     <p class="muted">
      KURNAKURNA group
     </p>

    </div>

   `)
   .join("");

}


/* =====================================================
   MARKET
===================================================== */

function market(){

 content.innerHTML = `

  <h2>Market</h2>

  <div class="card">

   <button
    class="btn"
    onclick="createMarketPost()"
   >
    ＋ Create Product Post
   </button>

  </div>

}


window.createMarketPost =

   prompt(
    "Product title:"
   );


  if(!title)
   return;


  const description =
   prompt(
    "Product description:"
   ) || "";


  const link =
   prompt(
    "Product/contact link:"
   ) || "";


  await push(
   ref(db,"market"),
   {

    title:title,

    description:
     description,

    link:link,

    name:
     user.displayName ||
     "Seller",

    uid:user.uid,

    createdAt:
     Date.now()

   }
  );


  loadMarket();

 };


async function loadMarket(){

 const snapshot =
  await get(
   ref(db,"market")
  );


 if(!snapshot.exists()){

  marketList.innerHTML = `

   <div class="card muted">
    No products yet.
   </div>

  `;

  return;

 }


 const products =
  Object
   .values(snapshot.val())
   .sort(
    (a,b)=>
     b.createdAt-a.createdAt
   );


 marketList.innerHTML =
  products.map(p => `

   <article class="card">

    <h3>
     🛍️ ${escapeHTML(p.title)}
    </h3>

    <p>
     ${escapeHTML(p.description)}
    </p>

    ${
     p.link
     ?
     `
      <p>
       <a
        href="${escapeHTML(p.link)}"
        target="_blank"
        rel="noopener"
       >
        ${escapeHTML(p.link)}
       </a>
      </p>
     `
     :
     ""
    }

    <small class="muted">
     Seller:
     ${escapeHTML(p.name)}
    </small>

   </article>

  `)
  .join("");

}

function games(){

 content.innerHTML = `

  <h2>Games</h2>

  <div class="grid">

    <h3>

   </p>

 `;

window.startGame =
 function(){

  let board =
   Array(9).fill("");

  let turn = "X";


  content.innerHTML = `

   <h2>
    Tic-Tac-Toe
   </h2>

   <div
    id="gameBoard"
    style="
     display:grid;
     grid-template-columns:
      repeat(3,80px);
     gap:5px;
    "
   ></div>

   <p id="gameInfo">
    Turn: X
   </p>

  `;


  gameBoard.innerHTML =
   board.map(
    (_,i) => `

     <button
      style="
       height:80px;
       font-size:30px;
       background:#222;
       color:white;
       border:1px solid #444;
      "
      onclick="gameMove(${i})"
     ></button>

    `
   ).join("");


  window.gameMove =
   function(i){

    if(board[i])
     return;


    board[i] =
     turn;


    gameBoard
     .children[i]
     .textContent =
      turn;


    const wins = [

     [0,1,2],
     [3,4,5],
     [6,7,8],
     [0,3,6],
     [1,4,7],
     [2,5,8],
     [0,4,8],
     [2,4,6]

    ];


    if(
     wins.some(
      w =>
       w.every(
        j =>
         board[j] === turn
       )
     )
    ){

     gameInfo.textContent =
      turn+" wins!";

     return;

    }


    if(board.every(Boolean)){

     gameInfo.textContent =
      "Draw!";

     return;

    }


    turn =
     turn === "X"
     ? "O"
     : "X";


    gameInfo.textContent =
     "Turn: "+turn;

   };

 };

/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(value){

 return String(
  value ?? ""
 )
 .replace(
  /[&<>"']/g,
  function(m){

   return {

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"

   }[m];

  }
 );

}
